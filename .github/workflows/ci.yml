name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit + simulation tests
        run: npm test
      # Balance report: the same 24 CPU games as `npm run sim`, but summarised (match length,
      # margin split, ring-point share, per-crew table, event rates) and audited — the goal log and
      # the gamebreaker steal ledger must reconcile with the final score. It fails on a broken
      # match (unfinished, non-finite, inconsistent scoring), never on the shape of the numbers,
      # which is the thing being judged. `npm run sim` stays as the one-line-per-game dev readout.
      - name: Headless balance report (24 CPU games)
        run: npm run balance -- --games 24 --diff pro --json balance-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-report
          path: balance-report.json
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: blitzball-x-dist
          path: dist

  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Serve dist and run browser QA (headless Chromium)
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          # Poll for the real server instead of sleeping a fixed 10s: a slow runner must not
          # read as a game failure, and a server that never comes up must fail loudly.
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:4173/ || { echo "preview server never came up"; exit 1; }
          npm run qa:touch -- http://127.0.0.1:4173/
          npm run qa:probe -- http://127.0.0.1:4173/
          npm run qa:merge -- http://127.0.0.1:4173/
          npm run qa:devtools -- http://127.0.0.1:4173/
      # Perf gate. The counters are deterministic for this seeded match state — measured
      # 662-665 draw calls / ~140.5k triangles at quality 'high' — so they are held at a
      # tight budget. sim ms/step is host-dependent (0.35-0.49 ms here), so its budget is
      # deliberately loose: it catches order-of-magnitude regressions, not runner noise.
      - name: Perf budget (draw calls / triangles / sim cost)
        run: npm run qa:perf -- http://127.0.0.1:4173/ --max-calls 700 --max-triangles 150000 --max-sim-ms 1.5

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
      # Hosted runners have system Chrome + fonts, so FCP/scores are measurable here — they are
      # not in the fontless Freebuff sandbox, where the tool correctly reports INCONCLUSIVE.
      # Perf is informational: the 2-core runner's frame times measure the runner, not the game.
      - name: Lighthouse audit of the built site
        run: npm run qa:lighthouse -- --perf-informational
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: screenshots/lighthouse
