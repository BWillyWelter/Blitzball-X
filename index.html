<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0b12" />
    <meta name="description" content="BLITZBALL X — arcade underwater 3-on-3 Blitzball. Turbo, tricks, washes, big hits, keepers, Gamebreakers. Two halves, most goals wins." />
    <title>BLITZBALL X</title>
    <style>
      /* Critical boot styles: the app shell is JS-rendered, so without this the page has zero
         paintable content until the whole bundle executes. The splash paints from HTML parse
         alone and is removed by main.js once the real title screen mounts. System font stack —
         web fonts must not delay the first contentful paint they're meant to improve. */
      html,
      body {
        margin: 0;
        background: #0b0b12;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: #ffd23f;
        font-family: Bangers, Impact, "Arial Narrow Bold", sans-serif;
        letter-spacing: 3px;
        text-shadow: 4px 4px 0 #0b0b12, 8px 8px 0 #ff2ea6;
        user-select: none;
      }
      #boot .b1 {
        font-size: clamp(52px, 14vw, 150px);
        line-height: 0.85;
      }
      #boot .b2 {
        font-size: clamp(64px, 20vw, 220px);
        line-height: 0.75;
        color: #5cf2ff;
        transform: rotate(6deg);
      }
      #boot .b3 {
        font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
        font-weight: 700;
        font-size: clamp(14px, 3vw, 20px);
        letter-spacing: 6px;
        color: #8ff7ff;
        opacity: 0.7;
        animation: bootpulse 1.1s ease-in-out infinite;
      }
      @keyframes bootpulse {
        0%,
        100% {
          opacity: 0.7;
        }
        50% {
          opacity: 0.25;
        }
      }
    </style>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b0b12'/%3E%3Ctext x='32' y='50' font-family='Impact' font-size='52' text-anchor='middle' fill='%235cf2ff' stroke='%23ff2ea6' stroke-width='2'%3EX%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <div id="boot" aria-hidden="true">
        <div class="b1">BLITZBALL</div>
        <div class="b2">X</div>
        <div class="b3">LOADING THE SPHERE…</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
